[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "g1_loco_bridge_v2"
version = "0.1.0"
description = "Unitree G1 29DoF handoff bridge for WALKRUN FSM 801/802"
requires-python = ">=3.8"
license = { text = "CC-BY-4.0" }

[tool.scikit-build]
cmake.version = ">=3.15"
cmake.build-type = "Release"
wheel.packages = ["src/g1_loco_bridge_v2"]

